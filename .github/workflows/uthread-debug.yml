name: uthread debug

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate-main:
    name: Validate main ref
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::uthread debug can only run against main."
            exit 1
          fi

  lab7:
    needs: validate-main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc \
            python3-pexpect

      - name: Build xv6
        run: |
          make clean >/dev/null
          make -j2 >uthread-build.log 2>&1

      - name: Run Lab7 with CPUS=3
        id: cpus3
        continue-on-error: true
        run: |
          set -o pipefail
          make test-suite SUITE=lab7-thread CPUS=3 2>&1 | tee uthread-cpus3.log

      - name: Run Lab7 with CPUS=1
        id: cpus1
        continue-on-error: true
        run: |
          set -o pipefail
          make test-suite SUITE=lab7-thread CPUS=1 2>&1 | tee uthread-cpus1.log

      - name: Upload uthread diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uthread-debug-${{ github.run_id }}
          path: |
            uthread-build.log
            uthread-cpus3.log
            uthread-cpus1.log
            test-results/
          if-no-files-found: warn

      - name: Verify both configurations
        if: always()
        run: |
          test "${{ steps.cpus3.outcome }}" = success
          test "${{ steps.cpus1.outcome }}" = success

  notify-manual-failure:
    name: Notify manual failure
    needs: [validate-main, lab7]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} uthread manual gate"
          body: |
            main 分支 uthread 手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
