name: Apply whereis patch

on:
  push:
    branches:
      - concept/125-whereis-command

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: concept/125-whereis-command
          fetch-depth: 0
      - name: Apply final patch and remove temporary files
        run: |
          git apply --check .github/whereis-final.patch
          git apply .github/whereis-final.patch
          rm .github/whereis-final.patch
          rm .github/workflows/apply-whereis-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 完成 whereis 命令"
          git push origin HEAD:concept/125-whereis-command
