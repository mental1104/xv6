name: Apply orange shell prompt

on:
  push:
    branches:
      - agent/orange-shell-prompt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/orange-shell-prompt
          fetch-depth: 0

      - name: Update prompt and exact-match fixtures
        run: |
          python3 - <<'PY'
          """将 Shell 身份提示符及所有精确匹配测试统一切换为橙色。"""

          from pathlib import Path

          replacements = {
              Path("user/shcore.inc"): (
                  ('#define ANSI_GREEN_BOLD "\\033[1;32m"',
                   '#define ANSI_ORANGE_BOLD "\\033[1;38;5;208m"'),
                  ('ANSI_GREEN_BOLD "root@xv6"',
                   'ANSI_ORANGE_BOLD "root@xv6"'),
              ),
              Path("tests/run.py"): (
                  ('ANSI_GREEN_BOLD = "\\x1b[1;32m"',
                   'ANSI_ORANGE_BOLD = "\\x1b[1;38;5;208m"'),
                  ('f"{ANSI_GREEN_BOLD}root@xv6{ANSI_RESET}:"',
                   'f"{ANSI_ORANGE_BOLD}root@xv6{ANSI_RESET}:"'),
              ),
              Path("tests/shell_history_interactive.py"): (
                  ('ANSI_GREEN_BOLD = "\\x1b[1;32m"',
                   'ANSI_ORANGE_BOLD = "\\x1b[1;38;5;208m"'),
                  ('f"{ANSI_GREEN_BOLD}root@xv6{ANSI_RESET}:"',
                   'f"{ANSI_ORANGE_BOLD}root@xv6{ANSI_RESET}:"'),
              ),
              Path("tests/host/scheduler_smoke.c"): (
                  ('"\\033[1;32mroot@xv6\\033[0m:\\033[1;34m/root\\033[0m# ";',
                   '"\\033[1;38;5;208mroot@xv6\\033[0m:\\033[1;34m/root\\033[0m# ";'),
              ),
              Path("tests/host/scheduler_visualizer.c"): (
                  ('"\\033[1;32mroot@xv6\\033[0m:\\033[1;34m/\\033[0m# ";',
                   '"\\033[1;38;5;208mroot@xv6\\033[0m:\\033[1;34m/\\033[0m# ";'),
              ),
          }

          for path, path_replacements in replacements.items():
              content = path.read_text(encoding="utf-8")
              for old, new in path_replacements:
                  count = content.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected exactly one occurrence of {old!r}, found {count}"
                      )
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")

          # 临时工作流和触发文件只负责生成补丁，最终 PR 不保留它们。
          Path(".github/workflows/apply-orange-shell-prompt.yml").unlink()
          Path(".github/.orange-prompt-trigger").unlink(missing_ok=True)
          PY

      - name: Install xv6 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc \
            python3-pexpect

      - name: Validate change
        run: |
          python3 -m py_compile tests/run.py tests/shell_history_interactive.py
          make test-unit
          make clean
          make -j2

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            user/shcore.inc \
            tests/run.py \
            tests/shell_history_interactive.py \
            tests/host/scheduler_smoke.c \
            tests/host/scheduler_visualizer.c \
            .github/workflows/apply-orange-shell-prompt.yml \
            .github/.orange-prompt-trigger
          git commit -m "feat: 将 xv6 Shell 身份提示改为橙色"
          git push origin HEAD:agent/orange-shell-prompt
