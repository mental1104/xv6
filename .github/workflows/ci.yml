name: xv6 CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  source-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout issue 155 pull request head
        uses: actions/checkout@v4
        with:
          ref: concept/155-disk-scheduling
          path: head

      - name: Package both source trees
        run: |
          mkdir -p export
          tar --exclude=.git -czf export/main.tar.gz -C main .
          tar --exclude=.git -czf export/head.tar.gz -C head .

      - name: Upload source trees
        uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: export/
          if-no-files-found: error
          retention-days: 1
