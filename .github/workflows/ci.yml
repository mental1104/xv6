name: xv6 CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  source-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout previous main
        uses: actions/checkout@v4
        with:
          ref: 0a7d790ab01985c8fc9f94465c3ee71b166920a0
          path: base

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout resolved issue 155 head
        uses: actions/checkout@v4
        with:
          ref: concept/155-disk-scheduling
          path: head

      - name: Package source trees
        run: |
          mkdir -p export
          tar --exclude=.git -czf export/base.tar.gz -C base .
          tar --exclude=.git -czf export/main.tar.gz -C main .
          tar --exclude=.git -czf export/head.tar.gz -C head .

      - name: Upload source trees
        uses: actions/upload-artifact@v4
        with:
          name: issue155-latest-three-way
          path: export/
          if-no-files-found: error
          retention-days: 1
