name: xv6 Main Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-target:
    name: Validate target ref
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require main target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${GITHUB_BASE_REF}" != "main" ]]; then
              echo "::error::Pull request gate only supports the main target."
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::xv6 Main Gate can only run against main."
            exit 1
          fi

  regression:
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc \
            python3-pexpect

      - name: Unit-test regression grader
        run: |
          python3 -m py_compile \
            tests/run.py \
            tests/run_lock_model.py \
            tests/run_usertests.py \
            tests/shell_history_interactive.py \
            tests/test_run_lock_model.py \
            tests/test_runner.py \
            tests/ci_plan.py \
            tests/test_ci_plan.py
          make test-unit
          python3 tests/run.py --list

      - name: Build xv6
        run: |
          make clean
          make -j2

      - name: Run stable integration regression
        run: |
          python3 tests/shell_history_interactive.py --cpus 3
          python3 tests/run.py --suite pr --cpus 3

      # 旧 usertests-full 会把全部用例塞进单个 QEMU，并在 writebig 阶段超时。
      # 逐项 runner 为每个用例提供独立看门狗，并保留稳定的完整用户态回归范围。
      - name: Run bounded usertests regression
        run: python3 tests/run_usertests.py --cpus 3

      # 锁模型 runner 会分别重建并验证单核、多核配置；放在其他 QEMU 回归之后，
      # 避免它留下的编译期 CPUS 配置污染前面的通用镜像。
      - name: Run lock model regression
        run: python3 tests/run_lock_model.py --cpus 3

      # _start_qemu() can fail before the Python runner creates its first log.
      # Capture one bounded serial boot attempt so startup panics are preserved.
      - name: Capture QEMU boot log
        if: failure()
        run: |
          mkdir -p test-results/infrastructure
          timeout 30s make -s --no-print-directory qemu \
            CPUS=3 QEMUEXTRA=-snapshot \
            > test-results/infrastructure/qemu-boot.log 2>&1 || true

      - name: Upload QEMU logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xv6-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore

  notify-manual-failure:
    name: Notify manual failure
    needs: [validate-target, regression]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} main manual gate"
          body: |
            main 分支手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
