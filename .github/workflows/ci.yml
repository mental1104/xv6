name: xv6 CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  resolve-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: concept/155-disk-scheduling
          fetch-depth: 0
          path: target

      - name: Reconstruct verified merge patch
        run: |
          cat tooling/.tmp/issue155-latest-patch/part-*.b64 \
            | base64 --decode > /tmp/issue155-latest.patch
          echo "f39c67449fafe9bf05babe034d4f4458ef129a81f50eb145ff6d938c42f8d2ca  /tmp/issue155-latest.patch" \
            | sha256sum --check -

      - name: Resolve conflicts on exact refs
        working-directory: target
        env:
          EXPECTED_REMOTE_HEAD: f1345323039cbd1f4b3ea1f3e303b6c689252b3b
          EXPECTED_MAIN: 90f664ad6e38dba70888facbb43e858b9f091cf7
        run: |
          set -euo pipefail
          git fetch origin main concept/155-disk-scheduling
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/concept/155-disk-scheduling)" = "$EXPECTED_REMOTE_HEAD"
          git config user.name "mental1104"
          git config user.email "64130690+mental1104@users.noreply.github.com"
          git reset --hard "$EXPECTED_REMOTE_HEAD"
          git merge --no-commit --no-ff "$EXPECTED_MAIN" || true
          test -f .git/MERGE_HEAD
          git read-tree --reset -u "$EXPECTED_MAIN"
          test -f .git/MERGE_HEAD
          git clean -fdx
          git apply --check /tmp/issue155-latest.patch
          git apply /tmp/issue155-latest.patch
          git add -A
          git diff --cached --check "$EXPECTED_MAIN"
          test "$(git diff --cached --name-only "$EXPECTED_MAIN" | wc -l)" -eq 17
          git diff --cached --name-only "$EXPECTED_MAIN"
          git commit -m "merge: 同步最新 main 并解决磁盘调度冲突"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc \
            python3-pexpect

      - name: Build and test resolved tree
        working-directory: target
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/run.py \
            tests/run_lock_model.py \
            tests/run_usertests.py \
            tests/shell_history_interactive.py \
            tests/test_run_lock_model.py \
            tests/test_runner.py \
            tests/ci_plan.py \
            tests/test_ci_plan.py
          make test-unit
          make clean
          make -j2
          python3 tests/run.py --suite pr --cpus 3
          python3 tests/run_lock_model.py --cpus 3
          make clean
          make -j2 CPUS=1
          python3 tests/run.py --suite usertests-core --cpus 1
          make clean
          make -j2
          python3 tests/run_usertests.py --cpus 3

      - name: Push resolved target branch
        working-directory: target
        env:
          EXPECTED_REMOTE_HEAD: f1345323039cbd1f4b3ea1f3e303b6c689252b3b
        run: |
          git push \
            --force-with-lease=refs/heads/concept/155-disk-scheduling:$EXPECTED_REMOTE_HEAD \
            origin HEAD:refs/heads/concept/155-disk-scheduling
