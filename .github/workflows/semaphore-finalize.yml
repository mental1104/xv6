name: semaphore finalize

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'concept/151-semaphore'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Apply final repository wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "Makefile",
              "  $K/sysproc.o \\\n  $K/sysps.o \\\n",
              "  $K/sysproc.o \\\n  $K/syssem.o \\\n  $K/semaphore.o \\\n  $K/semexit.o \\\n  $K/sysps.o \\\n",
          )
          replace_once(
              "Makefile",
              "# 保留 proc.c 的历史入口作为可链接后备，由 sched.c 提供公开调度入口。\n$K/proc.o: CFLAGS += -Dprocinit=legacy_procinit -Dscheduler=legacy_scheduler -Dyield=legacy_yield\n",
              "# 保留 proc.c 的历史入口作为可链接后备，由 sched.c 和 semexit.c 提供公开入口。\n$K/proc.o: CFLAGS += -Dprocinit=legacy_procinit -Dscheduler=legacy_scheduler -Dyield=legacy_yield -Dexit=proc_exit_without_semaphore\n",
          )
          replace_once(
              "Makefile",
              "\t$U/_pgtbltest\\\n\t$U/_vaaccesstest\\\n",
              "\t$U/_pgtbltest\\\n\t$U/_semaphoretest\\\n\t$U/_vaaccesstest\\\n",
          )
          replace_once(
              "user/init.c",
              '  {"/pgtbltest", XV6_TEST_PATH("pgtbltest")},\n  {"/vaaccesstest", XV6_TEST_PATH("vaaccesstest")},\n',
              '  {"/pgtbltest", XV6_TEST_PATH("pgtbltest")},\n  {"/semaphoretest", XV6_TEST_PATH("semaphoretest")},\n  {"/vaaccesstest", XV6_TEST_PATH("vaaccesstest")},\n',
          )
          replace_once(
              "tests/guest/xv6test.c",
              'static char *core_ps_argv[] = {XV6_TEST_PATH("pstest"), 0};\n',
              'static char *core_ps_argv[] = {XV6_TEST_PATH("pstest"), 0};\nstatic char *core_semaphore_argv[] = {XV6_TEST_PATH("semaphoretest"), 0};\n',
          )
          replace_once(
              "tests/guest/xv6test.c",
              '  {"core", "core-ps", core_ps_argv},\n',
              '  {"core", "core-ps", core_ps_argv},\n  {"core", "core-semaphore", core_semaphore_argv},\n',
          )
          PY
          git rm .github/workflows/semaphore-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile user/init.c tests/guest/xv6test.c
          git commit -m "build: 接入信号量测试闭环"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc \
            python3-pexpect
      - name: Build and test CPUS=3
        run: |
          make clean
          make -j2 CPUS=3 | tee /tmp/build-cpu3.log
          python3 tests/run.py --suite usertests-core --cpus 3 | tee /tmp/test-cpu3.log
      - name: Build and test CPUS=1
        run: |
          make clean
          make -j2 CPUS=1 | tee /tmp/build-cpu1.log
          python3 tests/run.py --suite usertests-core --cpus 1 | tee /tmp/test-cpu1.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semaphore-verification
          path: |
            /tmp/build-cpu3.log
            /tmp/test-cpu3.log
            /tmp/build-cpu1.log
            /tmp/test-cpu1.log
