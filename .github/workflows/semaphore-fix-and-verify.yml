name: semaphore fix and verify

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'concept/151-semaphore'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Fix include ordering and remove temporary workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ("kernel/semaphore.c", "kernel/semexit.c"):
              path = Path(name)
              text = path.read_text()
              anchor = '#include "param.h"\n#include "spinlock.h"\n'
              if anchor not in text:
                  raise SystemExit(f"missing include anchor in {name}")
              path.write_text(text.replace(
                  anchor,
                  '#include "param.h"\n#include "riscv.h"\n#include "spinlock.h"\n',
                  1,
              ))
          PY
          git rm .github/workflows/semaphore-verify.yml
          git rm .github/workflows/semaphore-fix-and-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kernel/semaphore.c kernel/semexit.c
          git commit -m "fix: 补齐信号量页表类型依赖"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc \
            python3-pexpect
      - name: Build and test CPUS=3
        shell: bash
        run: |
          set -o pipefail
          make clean
          make -j2 CPUS=3 2>&1 | tee /tmp/build-cpu3.log
          python3 tests/run.py --suite usertests-core --cpus 3 2>&1 | tee /tmp/test-cpu3.log
          cp test-results/usertests-core/usertests-core.log /tmp/guest-cpu3.log
      - name: Build and test CPUS=1
        shell: bash
        run: |
          set -o pipefail
          make clean
          make -j2 CPUS=1 2>&1 | tee /tmp/build-cpu1.log
          python3 tests/run.py --suite usertests-core --cpus 1 2>&1 | tee /tmp/test-cpu1.log
          cp test-results/usertests-core/usertests-core.log /tmp/guest-cpu1.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semaphore-verification-fixed
          path: |
            /tmp/build-cpu3.log
            /tmp/test-cpu3.log
            /tmp/guest-cpu3.log
            /tmp/build-cpu1.log
            /tmp/test-cpu1.log
            /tmp/guest-cpu1.log
