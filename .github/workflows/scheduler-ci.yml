name: Scheduler family Main Gate

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "kernel/proc.c"
      - "kernel/proc.h"
      - "kernel/sched.c"
      - "kernel/sched.h"
      - "kernel/schedstat.h"
      - "kernel/schedtrace.c"
      - "kernel/schedtrace.h"
      - "kernel/sysproc.c"
      - "kernel/trap.c"
      - "user/schedviz.c"
      - "tests/guest/schedtest.c"
      - "tests/host/scheduler_smoke.c"
      - "tests/host/scheduler_visualizer.c"
      - "tests/run.py"
      - "tests/run_usertests.py"
      - ".github/workflows/scheduler-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate-main:
    name: Validate main ref
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Scheduler family Main Gate can only run against main."
            exit 1
          fi

  scheduler:
    needs: validate-main
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        policy: [rr, fifo, sjf, stcf, mlfq, cfs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc

      - name: Build scheduler smoke runner
        run: |
          gcc -Wall -Werror -std=c11 -D_POSIX_C_SOURCE=200809L \
            -o scheduler_smoke tests/host/scheduler_smoke.c

      - name: Test red-black tree
        run: make test-rbtree

      - name: Build policy
        run: |
          make clean
          make -j2 SCHED_POLICY=${{ matrix.policy }}

      - name: Run single-CPU scheduler behavior test
        run: ./scheduler_smoke --policy ${{ matrix.policy }} --cpus 1

  smp-smoke:
    needs: validate-main
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        policy: [rr, mlfq, cfs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc

      - name: Build scheduler smoke runner
        run: |
          gcc -Wall -Werror -std=c11 -D_POSIX_C_SOURCE=200809L \
            -o scheduler_smoke tests/host/scheduler_smoke.c

      - name: Build policy
        run: |
          make clean
          make -j2 SCHED_POLICY=${{ matrix.policy }}

      - name: Run three-CPU scheduler smoke test
        run: ./scheduler_smoke --policy ${{ matrix.policy }} --cpus 3

  regression:
    needs: validate-main
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc \
            python3-pexpect

      - name: Run runner unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build default RR policy
        run: |
          make clean
          make -j2 SCHED_POLICY=rr

      # 将交互式 Shell 与通用 suite 分成独立步骤，使提示符、行编辑或作业控制失败
      # 能直接定位，同时仍复用同一份已构建的 kernel 与 fs.img。
      - name: Run shell interaction regression
        run: python3 tests/shell_history_interactive.py --cpus 3

      - name: Run regression suites
        run: python3 tests/run.py --suite pr --cpus 3

      - name: Run complete usertests
        run: python3 tests/run_usertests.py --cpus 3

      - name: Run reparent cleanup single-core
        run: |
          # CPUS 同时参与编译期 schedtrace 元数据和 QEMU -smp，切换到单核前必须
          # 重新构建，避免使用按三核配置生成的旧目标文件掩盖回收时序问题。
          make clean
          make -j2 CPUS=1 SCHED_POLICY=rr
          python3 tests/run_usertests.py \
            --cpus 1 \
            --case reparent2 \
            --case reparent

      - name: Upload regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-regression-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore

  notify-manual-failure:
    name: Notify manual failure
    needs: [validate-main, scheduler, smp-smoke, regression]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} scheduler manual gate"
          body: |
            main 分支 Scheduler family 手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
