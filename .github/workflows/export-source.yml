name: Export branch source

on:
  push:
    branches:
      - concept/125-whereis-command

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: xv6-source
          path: .
          include-hidden-files: true
